# Canonical LTX text-to-video workload for the universal optimization agent.
# Uses a FastVideo-supported LTX-2 distilled checkpoint so discovery and
# end-to-end validation do not require LTX-specific fusion annotations.
schema_version: 1
workload_id: ltx-t2v-480p
description: >
  Canonical LTX proof workload for MotionKernel's model-independent optimizer.
  Distilled checkpoint keeps overnight GPU budgets practical while still
  exercising a full FastVideo generation path.
model:
  model_id: FastVideo/LTX2-Distilled-Diffusers
task: t2v
prompt: >
  A red fox trots through fresh powder snow at golden hour, soft rim light,
  gentle camera pan following the animal, cinematic nature documentary style.
sampling:
  height: 480
  width: 768
  num_frames: 97
  num_inference_steps: 8
  guidance_scale: 1.0
  seed: 1024
  fps: 24
  dtype: bfloat16
runtime:
  num_gpus: 1
  use_fsdp_inference: false
  dit_cpu_offload: false
  vae_cpu_offload: false
  text_encoder_cpu_offload: true
  pin_cpu_memory: false
measurement:
  warmups: 1
  runs: 2
  save_frames: true
  save_video: false
parity:
  policy: byte_equal
performance:
  min_end_to_end_speedup: 1.01
  max_peak_memory_regression: 0.05
tags:
  - ltx
  - t2v
  - 480p
  - proof
